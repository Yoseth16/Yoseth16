<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="Yoseth Lopez. I build web products end to end, from the data pipeline to the interface.">
  <title>Yoseth Lopez</title>
  <style>
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  @keyframes signal { 0%,60%,100% { opacity: .25 } 20% { opacity: 1 } }
  @keyframes flow { to { stroke-dashoffset: -16 } }
  .pulse { animation: pulse 2.4s ease-in-out infinite }
  .sig { animation: signal 3.6s ease-in-out infinite }
  .flow { stroke-dasharray: 4 4; animation: flow 1.4s linear infinite }
  @media (prefers-reduced-motion: reduce) { .pulse, .sig, .flow { animation: none } }
</style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#0A0A0B" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1000" height="310" fill="url(#fade)"/></mask>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="309" rx="20" fill="#FAFAFA" stroke="#E4E4E7"/>
  <rect x="1" y="1" width="998" height="308" rx="19" fill="url(#dots)" mask="url(#m)"/>

  <circle class="pulse" cx="62" cy="62" r="5" fill="#2F6BFF"/>
  <text x="80" y="68" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" letter-spacing="0.4" fill="#52525B">building NotiTech</text>

  <text x="54" y="170" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="88" font-weight="600" letter-spacing="-2.8" fill="#0A0A0B">Yoseth Lopez</text>
  <text x="58" y="226" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="31" fill="#52525B">I build web products end to end,</text>
  <text x="58" y="266" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="31" fill="#52525B">from the data pipeline to the interface.</text>

  <line x1="640" y1="140" x2="940" y2="140" stroke="#D4D4D8" stroke-width="2"/>
  <line class="flow" x1="640" y1="140" x2="940" y2="140" stroke="#2F6BFF" stroke-opacity="0.55" stroke-width="2"/>
  <circle class="sig" style="animation-delay:0.00s" cx="640" cy="140" r="7" fill="#FAFAFA" stroke="#52525B" stroke-width="2"/>
  <circle class="sig" style="animation-delay:0.45s" cx="720" cy="140" r="7" fill="#FAFAFA" stroke="#52525B" stroke-width="2"/>
  <circle class="sig" style="animation-delay:0.90s" cx="800" cy="140" r="7" fill="#FAFAFA" stroke="#52525B" stroke-width="2"/>
  <circle class="sig" style="animation-delay:1.35s" cx="880" cy="140" r="7" fill="#FAFAFA" stroke="#52525B" stroke-width="2"/>
  <circle class="sig" style="animation-delay:1.80s" cx="940" cy="140" r="7" fill="#2F6BFF" stroke="#2F6BFF" stroke-width="2"/>
  
</svg>
