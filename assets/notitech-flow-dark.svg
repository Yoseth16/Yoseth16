<circle r="3.6" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="5.0s" begin="0.09s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.8;1" path="M30 88.0 L970 88.0"/><animate attributeName="opacity" dur="5.0s" begin="0.09s" repeatCount="indefinite" keyTimes="0;0.03;0.78;0.8;1" values="0;0.55;0.55;0;0"/></circle>
<circle r="2.4" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="5.0s" begin="0.18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.8;1" path="M30 88.0 L970 88.0"/><animate attributeName="opacity" dur="5.0s" begin="0.18s" repeatCount="indefinite" keyTimes="0;0.03;0.78;0.8;1" values="0;0.3;0.3;0;0"/></circle>
<rect x="30" y="32" width="164" height="112" rx="14" fill="#111113" stroke="#27272A" stroke-width="1.5"/>
