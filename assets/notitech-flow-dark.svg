<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="176" viewBox="0 0 1000 176" role="img" aria-label="NotiTech data flow: RSS feeds and external APIs, an AI pipeline that classifies and summarizes, PostgreSQL via Supabase, a FastAPI backend, and a Next.js interface.">
<title>NotiTech data flow</title>
<style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes flow{to{stroke-dashoffset:-16}}@keyframes hit{0%{opacity:0}5%{opacity:1}35%{opacity:0}100%{opacity:0}}@keyframes bar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}.pulse{animation:pulse 2.4s ease-in-out infinite}.flow{stroke-dasharray:4 4;animation:flow 1.4s linear infinite}.hit{opacity:0;animation:hit 5.0s ease-out infinite}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:bar 1.1s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.pulse,.flow,.hit,.bar{animation:none}.hit{opacity:0}}</style>
<defs>
<filter id="glow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow2" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="0.5" y="0.5" width="999" height="175" rx="20" fill="#0A0A0B" stroke="#27272A"/>
<line x1="30" y1="88.0" x2="970" y2="88.0" stroke="#27272A" stroke-width="2"/>
<line class="flow" x1="30" y1="88.0" x2="970" y2="88.0" stroke="#5B8DFF" stroke-opacity="0.55" stroke-width="2"/>
